[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldlog"
dynamic = ["version"]
description = "Run catalogued network diagnostic commands against a target and keep a per-target log of every run — a Textual TUI plus CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "textual>=8.2.0,<9",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/proverbial-toast/fieldlog"
Repository = "https://github.com/proverbial-toast/fieldlog"
Issues = "https://github.com/proverbial-toast/fieldlog/issues"

[project.scripts]
fieldlog = "fieldlog.__main__:main"

[tool.setuptools.packages.find]
# Found, not hand-listed: a literal ["fieldlog"] missed fieldlog.tui when app.py
# was split, and the wheel shipped without it — every subcommand worked and the
# TUI died on import. The CI package job installs the wheel and imports it.
include = ["fieldlog*"]

[tool.setuptools.dynamic]
version = { attr = "fieldlog.__version__" }

[tool.setuptools.package-data]
# recipes.d/*.yaml is the shipped catalog since the themes split; leaving it
# out would hand a wheel 15 tools and one chain where a checkout has 19 and six.
fieldlog = ["*.tcss", "*.yaml", "recipes.d/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness-focused. Pyflakes (F) plus the essential pycodestyle errors and
# warnings. Deliberately not the opinionated stylistic sets: UP would rewrite the
# List/Optional typing the code chooses, and BLE would fight the broad `except`
# used on purpose for graceful degradation (a bad drop-in never crashes the app).
select = ["E4", "E7", "E9", "F", "W"]
