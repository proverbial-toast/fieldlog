name: CI

on:
  push:
    branches: [main]
    # A release is a tag, and `branches:` alone never matches one. Tagging runs
    # the full matrix again on purpose: what gets handed out is tested first.
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # Both supported systems, not just the one the work is done on: the ioctl
    # number behind $LHOST and the default interface name differ on Darwin, and
    # a Linux-only run would never exercise either.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

  package:
    # The wheel is what an install actually gets. A subpackage left out of the
    # build config breaks the TUI on import while every subcommand still works,
    # and an editable dev checkout never reproduces it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel

      - name: Install it clean and import the TUI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import fieldlog.app"
          /tmp/smoke/bin/fieldlog list -q > /dev/null

  release:
    # A tag, and only after the tests and the wheel smoke test have passed on
    # it: a release page is the one place a stale or broken artifact does real
    # damage, because the person downloading it has no way to tell.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: The tag and __version__ must say the same thing
        # Nothing else enforces it, and the two disagreeing is the quiet kind
        # of wrong: `fieldlog --version` would report one number while the
        # release page, the wheel filename and the install command said
        # another. Read with sed rather than imported, so the check needs no
        # environment to run in.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' fieldlog/__init__.py)"
          echo "tag $tag · __version__ $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match __version__ $version — bump fieldlog/__init__.py or retag"
            exit 1
          fi

      - name: Build the wheel and the sdist
        # Both: the wheel is what pipx installs, the sdist is what lets anyone
        # rebuild it, and it is the same one command.
        run: uv build

      - name: Install the wheel clean and run it
        run: |
          uv venv /tmp/release-smoke
          uv pip install --python /tmp/release-smoke/bin/python dist/*.whl
          /tmp/release-smoke/bin/python -c "import fieldlog.app"
          /tmp/release-smoke/bin/fieldlog --version
          /tmp/release-smoke/bin/fieldlog list -q > /dev/null

      - name: Publish the release with both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
