# Chains: catalogued recipes run in order against one scope, sharing the
# first step's $OUTDIR. A step may name a recipe from any theme — but a
# chain whose step belongs to a theme you have switched off is skipped,
# and `fieldlog doctor` says which theme did it.
# The variables a recipe may use ($TARGET, $HOST, $LHOST, $IFACE, $OUTDIR,
# $RUN_ID) and the `platform:` rule are documented in docs/recipes.md.
# Switch this theme off with `themes: {chains: false}` in
# ~/.config/fieldlog/themes.yaml; `fieldlog doctor` lists what is off.

theme: chains

chains:
  - id: reach
    name: "reachability · ping, trace, ptr"
    steps:
      - ping/quick
      - recipe: traceroute/icmp
        continue: true
      - dig/ptr

  - id: https-check
    name: "https endpoint · route, ports, cert, tls, latency"
    steps:
      - ip/route
      - recipe: tcpcheck/common
        continue: true
      - openssl/expires14
      - openssl/versions
      - curl/pin
      - curl/p95

  - id: tls-audit
    name: "certificate + protocol + cipher audit"
    steps:
      - openssl/leaf
      - recipe: openssl/expires14
        continue: true
      - openssl/versions
      - nmap/ciphers

  - id: dns-sanity
    name: "dns · authoritative, resolvers, dnssec, pinned fetch"
    steps:
      - dig/nssearch
      - dig/resolvers
      - recipe: dig/vtrace
        continue: true
      - curl/pin

  - id: lan-survey
    name: "local segment · route, neighbours, sweep"
    steps:
      - ip/route
      - ip/neigh
      - fping/sweep

  # openssl/selfsigned writes cert.pem + key.pem into the shared $OUTDIR that
  # python-server/https then loads. curl -k https://<lhost>:8443/ to hit it; Ctrl+C stops it.
  - id: tls-serve
    name: "self-signed cert, then HTTPS server"
    steps:
      - openssl/selfsigned
      - python-server/https

  # Three questions in the order you ask them on arriving somewhere new: what
  # am I plugged into, who says they are the router, and does anything sit in
  # the way on the path out. The two listeners are allowed to find nothing.
  - id: whereami
    name: "where am I · switch, router, way out"
    steps:
      - recipe: wire/lldp
        continue: true
      - recipe: ra/solicit
        continue: true
      - captive/check

  - id: path-quality
    name: "link quality · reachable, steady, and how big a packet"
    steps:
      - ping/quick
      - rtt/jitter
      - pmtu/bisect
