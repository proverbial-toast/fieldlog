# Is it there, and how far away? ICMP and hop-by-hop paths.
# ping and traceroute differ between Linux and macOS, so those presets are
# written once per platform under the same id.
# The variables a recipe may use ($TARGET, $HOST, $LHOST, $IFACE, $OUTDIR,
# $RUN_ID) and the `platform:` rule are documented in the project README.
# Switch this theme off with `themes: {reach: false}` in
# ~/.config/fieldlog/themes.yaml; `fieldlog doctor` lists what is off.

theme: reach

recipes:
  - id: ping
    name: "ICMP Reachability"
    bin: ping
    # The parse rule reads both stats lines: Linux writes `4 received`, Darwin
    # `4 packets received`, and the loss figure is `0%` on one and `0.0%` on the other.
    presets:
      - id: quick
        name: "quick · 4 probes"
        platform: linux
        flags: "-c 4 -W 1 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: quick
        name: "quick · 4 probes"
        platform: darwin
        # On Darwin -W is milliseconds of wait per reply, not seconds; -t is the
        # overall deadline, which is what the Linux -W 1 is here for.
        flags: "-c 4 -t 6 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: linux
        flags: "-c 1 -W 1 -I $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: darwin
        # -b is Darwin's boundif: send through this interface, as Linux -I does.
        flags: "-c 1 -t 2 -b $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: flood
        name: "flood · 500 pps"
        flags: "-f -c 500 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: linux
        flags: "-M do -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: darwin
        # -D sets the don't-fragment bit; Darwin has no -M do.
        flags: "-D -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: linux
        flags: "-6 -c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: darwin
        # Darwin's ping is v4 only; ping6 is the separate binary.
        bin: ping6
        flags: "-c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"

  - id: traceroute
    name: "Path & MTU Trace"
    bin: traceroute
    presets:
      - id: icmp
        name: "icmp · numeric"
        flags: "-n -I $TARGET"
      - id: mtu
        name: "mtu discovery"
        platform: linux
        flags: "-n --mtu $TARGET"
      - id: tcp80
        name: "tcp syn :80"
        platform: linux
        flags: "-T -p 80 $TARGET"

  - id: mtr
    name: "Continuous Path Monitor"
    bin: mtr
    presets:
      - id: report
        name: "report · 100 cycles"
        flags: "--report --report-cycles 100 $TARGET"
      - id: tcp
        name: "tcp mode :443"
        flags: "--tcp --port 443 $TARGET"

  - id: fping
    name: "Parallel ICMP Sweep"
    bin: fping
    presets:
      - id: sweep
        name: "alive hosts in subnet"
        flags: "-a -q -g -r 1 $TARGET 2>/dev/null || [ $? -eq 1 ]"
