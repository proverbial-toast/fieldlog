# Is it there, and how far away? ICMP and hop-by-hop paths.
# ping and traceroute differ between Linux and macOS, so those presets are
# written once per platform under the same id.
# The variables a recipe may use ($TARGET, $HOST, $LHOST, $IFACE, $OUTDIR,
# $RUN_ID) and the `platform:` rule are documented in the project README.
# Switch this theme off with `themes: {reach: false}` in
# ~/.config/fieldlog/themes.yaml; `fieldlog doctor` lists what is off.

theme: reach

recipes:
  - id: ping
    name: "ICMP Reachability"
    bin: ping
    # The parse rule reads both stats lines: Linux writes `4 received`, Darwin
    # `4 packets received`, and the loss figure is `0%` on one and `0.0%` on the other.
    presets:
      - id: quick
        name: "quick · 4 probes"
        platform: linux
        flags: "-c 4 -W 1 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: quick
        name: "quick · 4 probes"
        platform: darwin
        # On Darwin -W is milliseconds of wait per reply, not seconds; -t is the
        # overall deadline, which is what the Linux -W 1 is here for.
        flags: "-c 4 -t 6 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: linux
        flags: "-c 1 -W 1 -I $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: darwin
        # -b is Darwin's boundif: send through this interface, as Linux -I does.
        flags: "-c 1 -t 2 -b $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: flood
        name: "flood · 500 pps"
        flags: "-f -c 500 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: linux
        flags: "-M do -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: darwin
        # -D sets the don't-fragment bit; Darwin has no -M do.
        flags: "-D -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: linux
        flags: "-6 -c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: darwin
        # Darwin's ping is v4 only; ping6 is the separate binary.
        bin: ping6
        flags: "-c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: ttl
        name: "ttl · how far away, and what answered"
        platform: linux
        # The reply's ttl left the far end at that system's own default — 64 on
        # linux and bsd, 128 on windows, 255 on most network kit — and lost one
        # per hop on the way back, so a single probe carries both the distance
        # and a guess at what is standing there.
        flags: >-
          ping -c 1 -W 2 $TARGET
          | awk -F'ttl=' '{print}
          /ttl=/ {split($2, f, " "); t = f[1] + 0;
          init = t <= 64 ? 64 : (t <= 128 ? 128 : 255);
          printf "ttl=%d · %d hops away · initial ttl %d (%s)\n", t, init - t, init,
          init == 64 ? "linux/bsd" : (init == 128 ? "windows" : "network kit"); found = 1}
          END {if (!found) print "no reply · no ttl to read"}'
        parse: 'ttl=(?P<ttl>\d+) · (?P<hops>\d+) hops away'
        summary: "{hops} hops · ttl {ttl}"
        expect: 'hops away'
      - id: ttl
        name: "ttl · how far away, and what answered"
        platform: darwin
        # Darwin's -t is the deadline in seconds that Linux spells -W.
        flags: >-
          ping -c 1 -t 2 $TARGET
          | awk -F'ttl=' '{print}
          /ttl=/ {split($2, f, " "); t = f[1] + 0;
          init = t <= 64 ? 64 : (t <= 128 ? 128 : 255);
          printf "ttl=%d · %d hops away · initial ttl %d (%s)\n", t, init - t, init,
          init == 64 ? "linux/bsd" : (init == 128 ? "windows" : "network kit"); found = 1}
          END {if (!found) print "no reply · no ttl to read"}'
        parse: 'ttl=(?P<ttl>\d+) · (?P<hops>\d+) hops away'
        summary: "{hops} hops · ttl {ttl}"
        expect: 'hops away'

  - id: traceroute
    name: "Path & MTU Trace"
    bin: traceroute
    presets:
      - id: icmp
        name: "icmp · numeric"
        flags: "-n -I $TARGET"
      - id: mtu
        name: "mtu discovery"
        platform: linux
        flags: "-n --mtu $TARGET"
      - id: tcp80
        name: "tcp syn :80"
        platform: linux
        flags: "-T -p 80 $TARGET"
      - id: asn
        name: "as number per hop · whose network is it"
        platform: linux
        # -A asks Cymru's whois server which AS each hop belongs to, so the
        # trace makes a lookup of its own off to one side. Worth it: the hop
        # where the AS changes is the hop where the problem stops being yours.
        flags: "-A -n $TARGET"
        parse: '\[AS(?P<asn>\d+)\]'
        summary: "last hop seen in AS{asn}"
      - id: asn
        name: "as number per hop · whose network is it"
        platform: darwin
        # BSD traceroute spells the same lookup -a.
        flags: "-a -n $TARGET"
        parse: '\[AS(?P<asn>\d+)\]'
        summary: "last hop seen in AS{asn}"

  - id: mtr
    name: "Continuous Path Monitor"
    bin: mtr
    presets:
      - id: report
        name: "report · 100 cycles"
        flags: "--report --report-cycles 100 $TARGET"
      - id: tcp
        name: "tcp mode :443"
        flags: "--tcp --port 443 $TARGET"

  - id: fping
    name: "Parallel ICMP Sweep"
    bin: fping
    presets:
      - id: sweep
        name: "alive hosts in subnet"
        flags: "-a -q -g -r 1 $TARGET 2>/dev/null || [ $? -eq 1 ]"
