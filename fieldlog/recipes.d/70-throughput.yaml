# How much the path actually carries. Needs a cooperating far end.
# The variables a recipe may use ($TARGET, $HOST, $LHOST, $IFACE, $OUTDIR,
# $RUN_ID) and the `platform:` rule are documented in docs/recipes.md.
# Switch this theme off with `themes: {throughput: false}` in
# ~/.config/fieldlog/themes.yaml; `fieldlog doctor` lists what is off.

theme: throughput

recipes:
  - id: iperf3
    name: "Throughput Benchmark"
    bin: iperf3
    presets:
      - id: tcp4
        name: "tcp · 10s / 4 streams"
        flags: "-c $TARGET -t 10 -P 4 --json --logfile $OUTDIR/iperf3_tcp4.json"
      - id: udp
        name: "udp · 100 Mbit"
        flags: "-c $TARGET -u -b 100M -t 10"
        parse: '(?P<rate>[\d.]+ [KMG]bits/sec)[^\n]*receiver'
        summary: "{rate}"
      - id: reverse
        name: "reverse (download)"
        flags: "-c $TARGET -R -t 10"
        parse: '(?P<rate>[\d.]+ [KMG]bits/sec)[^\n]*receiver'
        summary: "{rate}"

  - id: iperf3
    presets:
      - id: serve
        name: "one-shot server bound to $LHOST"
        flags: "-s -1 -B $LHOST"
      - id: bloat
        name: "bufferbloat · rtt at rest, then under load"
        # The far end needs `iperf3 -s`. A path that answers in 8 ms idle and
        # 300 ms while a transfer runs is not a slow link: it is a queue deep
        # enough to hold a second of traffic, and no throughput number shows it.
        flags: >-
          timeout 90 sh -c 'avg() { ping -c "$1" -q $TARGET | awk -F/ "/min.avg/ {print \$5}"; };
          idle=$(avg 5);
          iperf3 -c $TARGET -t 12 >/dev/null 2>&1 &
          sleep 2; load=$(avg 8); wait;
          echo "idle ${idle:-?} ms · loaded ${load:-?} ms"'
        parse: 'idle (?P<idle>[\d.]+) ms · loaded (?P<loaded>[\d.]+) ms'
        summary: "rtt {idle} ms idle · {loaded} ms loaded"
