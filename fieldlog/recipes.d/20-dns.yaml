# What does the name resolve to, and who says so.
# resolvectl is Linux, scutil is its macOS stand-in.
# The variables a recipe may use ($TARGET, $HOST, $LHOST, $IFACE, $OUTDIR,
# $RUN_ID) and the `platform:` rule are documented in the project README.
# Switch this theme off with `themes: {dns: false}` in
# ~/.config/fieldlog/themes.yaml; `fieldlog doctor` lists what is off.

theme: dns

recipes:
  - id: dig
    name: "DNS Query"
    bin: dig
    presets:
      - id: a
        name: "A record"
        flags: "+short A $HOST"
      - id: trace
        name: "delegation trace"
        flags: "+trace $HOST"
      - id: ptr
        name: "reverse ptr"
        flags: "-x $TARGET +short"
      - id: dnssec
        name: "dnssec validate"
        flags: "+dnssec +multi $HOST"

  - id: resolvectl
    name: "Local Resolver State"
    bin: resolvectl
    platform: linux
    presets:
      - id: status
        name: "status"
        flags: "status $IFACE"
      - id: query
        name: "query via stub"
        flags: "query $HOST"

  # What resolvectl is for on a Mac: the resolver configuration the system is
  # actually using, per interface and per search domain.
  - id: scutil
    name: "Resolver Configuration"
    bin: scutil
    platform: darwin
    presets:
      - id: dns
        name: "dns configuration"
        flags: "--dns"

  - id: dig
    presets:
      - id: nssearch
        name: "soa serial per authoritative ns"
        flags: "+nssearch $HOST"
      - id: resolvers
        name: "same answer from 3 public resolvers?"
        flags: >-
          timeout 20 sh -c 'for ns in 1.1.1.1 8.8.8.8 9.9.9.9; do printf "%-8s " $ns;
          dig +short +time=2 +tries=1 A $HOST @$ns | sort | paste -sd, -; done'
      - id: vtrace
        name: "dnssec validation trace (delv)"
        bin: delv
        flags: "+vtrace $HOST"
      - id: version
        name: "what the nameserver admits to being"
        # The CHAOS-class query is the oldest one-line fingerprint there is.
        # A server either answers with its build or refuses, and the refusal is
        # an answer too. Aim it at a nameserver, not at a web host.
        flags: "@$TARGET version.bind chaos txt +short +time=2 +tries=1"
        parse: '"(?P<version>[^"]+)"'
        summary: "reports {version}"
      - id: wildcard
        name: "does a name nobody registered still resolve?"
        # A wildcard record turns every typo into a hit, which is why a
        # misrouted service can look like a dns fault for days. Ask for a label
        # that cannot exist and see whether an answer comes back anyway.
        flags: >-
          timeout 20 sh -c 'probe=fl-$(date +%s)-$$.$HOST;
          out=$(dig +short +time=2 +tries=1 A "$probe");
          if [ -n "$out" ]; then echo "$probe -> $out";
          echo "wildcard · a label nobody registered resolves";
          else echo "$probe -> nxdomain"; echo "no wildcard"; fi'
        parse: '(?P<verdict>(?:no )?wildcard)'
        summary: "{verdict}"
      - id: recursion
        name: "will it recurse for a stranger?"
        # Ask a resolver you are responsible for to look up a name it is not
        # authoritative for. REFUSED is the healthy answer for anything facing
        # the internet; NOERROR with an answer means it will do that for anyone
        # who asks, which is how a resolver becomes someone else's amplifier.
        flags: "@$TARGET example.com A +time=2 +tries=1"
        parse: 'status: (?P<status>[A-Z]+)'
        summary: "recursion for a stranger: {status}"
