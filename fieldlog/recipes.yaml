# fieldlog recipe catalog.
# fieldlog injects these env vars before spawning:
#   TARGET / TARGET_IP   the IP or subnet
#   TARGET_HOST          canonical hostname (may be empty)
#   LHOST                local host address (interface addr)
#   IFACE                local interface name
#   OUT_DIR / OUTDIR     per-run artifact dir ($OUTDIR in flags)
#   RUN_ID               zero-padded run counter (e.g. 01)
#
# A tool or preset marked `platform:` exists only on the systems it names, so
# the presets whose flags differ between Linux and macOS — ping, traceroute —
# are written once per platform under the same id, and the Linux-only tools
# (ss, ethtool, resolvectl) and their macOS stand-ins (lsof, scutil) are each
# present on one of the two.

recipes:
  - id: ping
    name: "ICMP Reachability"
    bin: ping
    # The parse rule reads both stats lines: Linux writes `4 received`, Darwin
    # `4 packets received`, and the loss figure is `0%` on one and `0.0%` on the other.
    presets:
      - id: quick
        name: "quick · 4 probes"
        platform: linux
        flags: "-c 4 -W 1 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: quick
        name: "quick · 4 probes"
        platform: darwin
        # On Darwin -W is milliseconds of wait per reply, not seconds; -t is the
        # overall deadline, which is what the Linux -W 1 is here for.
        flags: "-c 4 -t 6 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: linux
        flags: "-c 1 -W 1 -I $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: sweep
        name: "subnet sweep · fanout 16"
        platform: darwin
        # -b is Darwin's boundif: send through this interface, as Linux -I does.
        flags: "-c 1 -t 2 -b $IFACE $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: flood
        name: "flood · 500 pps"
        flags: "-f -c 500 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: linux
        flags: "-M do -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: mtu
        name: "mtu probe · df-bit 1472"
        platform: darwin
        # -D sets the don't-fragment bit; Darwin has no -M do.
        flags: "-D -s 1472 -c 3 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: linux
        flags: "-6 -c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"
      - id: v6
        name: "ipv6"
        platform: darwin
        # Darwin's ping is v4 only; ping6 is the separate binary.
        bin: ping6
        flags: "-c 4 $TARGET"
        parse: '(?P<rx>\d+)(?: packets)? received, (?P<loss>[\d.]+)% packet loss'
        summary: "{rx} replies · {loss}% loss"

  - id: traceroute
    name: "Path & MTU Trace"
    bin: traceroute
    presets:
      - id: icmp
        name: "icmp · numeric"
        flags: "-n -I $TARGET"
      - id: mtu
        name: "mtu discovery"
        platform: linux
        flags: "-n --mtu $TARGET"
      - id: tcp80
        name: "tcp syn :80"
        platform: linux
        flags: "-T -p 80 $TARGET"

  - id: mtr
    name: "Continuous Path Monitor"
    bin: mtr
    presets:
      - id: report
        name: "report · 100 cycles"
        flags: "--report --report-cycles 100 $TARGET"
      - id: tcp
        name: "tcp mode :443"
        flags: "--tcp --port 443 $TARGET"

  - id: arp-scan
    name: "ARP Layer-2 Discovery"
    bin: arp-scan
    presets:
      - id: localnet
        name: "localnet"
        flags: "--interface=$IFACE --localnet"
      - id: retry
        name: "slow · retry 3"
        flags: "--interface=$IFACE --retry=3 $TARGET"

  - id: dig
    name: "DNS Query"
    bin: dig
    presets:
      - id: a
        name: "A record"
        flags: "+short A $HOST"
      - id: trace
        name: "delegation trace"
        flags: "+trace $HOST"
      - id: ptr
        name: "reverse ptr"
        flags: "-x $TARGET +short"
      - id: dnssec
        name: "dnssec validate"
        flags: "+dnssec +multi $HOST"

  - id: resolvectl
    name: "Local Resolver State"
    bin: resolvectl
    platform: linux
    presets:
      - id: status
        name: "status"
        flags: "status $IFACE"
      - id: query
        name: "query via stub"
        flags: "query $HOST"

  # What resolvectl is for on a Mac: the resolver configuration the system is
  # actually using, per interface and per search domain.
  - id: scutil
    name: "Resolver Configuration"
    bin: scutil
    platform: darwin
    presets:
      - id: dns
        name: "dns configuration"
        flags: "--dns"

  - id: curl
    name: "HTTP Latency Profiler"
    bin: curl
    presets:
      - id: timing80
        name: "timing breakdown :80"
        flags: >-
          -o /dev/null -sS -w "dns=%{time_namelookup} tcp=%{time_connect}
          ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\n"
          http://$HOST/
        parse: 'total=(?P<total>\S+) code=(?P<code>\d{3})'
        summary: "HTTP {code} in {total}s"
      - id: timing443
        name: "timing breakdown :443"
        flags: >-
          -o /dev/null -sS -w "dns=%{time_namelookup} tcp=%{time_connect}
          ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\n"
          https://$HOST/
        parse: 'total=(?P<total>\S+) code=(?P<code>\d{3})'
        summary: "HTTP {code} in {total}s"
      - id: trace
        name: "full trace · headers + timing"
        flags: >-
          -sS -o /dev/null -D - -w "dns=%{time_namelookup} tcp=%{time_connect}
          tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}
          code=%{http_code}" --connect-timeout 5 --max-time 20 --retry 1
          --retry-delay 1 -H "User-Agent: fieldlog" -H "Accept: */*"
          -H "Cache-Control: no-cache" https://$HOST/healthz
        parse: 'total=(?P<total>\S+) code=(?P<code>\d{3})'
        summary: "HTTP {code} in {total}s"
      - id: headers
        name: "headers only"
        flags: "-sSI https://$HOST/"
        parse: 'HTTP/[\d.]+ (?P<code>\d{3})'
        summary: "HTTP {code}"
      - id: loop
        name: "loop · 20 requests"
        # curl's own URL globbing makes the 20 requests, one line of output each.
        flags: >-
          -o /dev/null -sS -w "%{http_code} %{time_total}s\n" --retry 0
          "https://$HOST/?[1-20]"

  - id: openssl
    name: "TLS Certificate Validator"
    bin: openssl
    presets:
      - id: chain
        name: "chain + expiry"
        flags: "s_client -connect $HOST:443 -showcerts"
        parse: 'Verify return code: (?P<code>\d+) \((?P<what>[^)]+)\)'
        summary: "verify: {what}"
        expect: 'Verify return code: 0 \(ok\)'
      - id: ciphers
        name: "cipher negotiation"
        flags: "s_client -connect $HOST:443 -tls1_3"

  - id: wrk
    name: "HTTP Load Probe"
    bin: wrk
    presets:
      - id: smoke
        name: "smoke · 10s / 4 conn"
        flags: "-t2 -c4 -d10s http://$HOST/"
        parse: 'Requests/sec:\s+(?P<rps>[\d.]+)'
        summary: "{rps} req/s"

  - id: ss
    name: "Local Socket Table"
    bin: ss
    platform: linux
    presets:
      - id: listen
        name: "listening sockets"
        flags: "-tulpn"
      - id: estab
        name: "established peers"
        flags: "-tn state established"

  # What ss is for on a Mac. `netstat` is there too, but lsof is the one that
  # names the process holding each socket, which is why ss/listen uses -p.
  - id: lsof
    name: "Listening Sockets"
    bin: lsof
    platform: darwin
    presets:
      - id: listen
        name: "listening sockets"
        flags: "-nP -iTCP -sTCP:LISTEN"

  - id: tcpdump
    name: "Packet Capture"
    bin: tcpdump
    presets:
      - id: host
        name: "host filter · 200 pkts"
        flags: "-i $IFACE -c 200 -nn -w $OUTDIR/capture.pcap host $TARGET"
      - id: icmp
        name: "icmp only"
        flags: "-i $IFACE -nn icmp"

  - id: iperf3
    name: "Throughput Benchmark"
    bin: iperf3
    presets:
      - id: tcp4
        name: "tcp · 10s / 4 streams"
        flags: "-c $TARGET -t 10 -P 4 --json --logfile $OUTDIR/iperf3_tcp4.json"
      - id: udp
        name: "udp · 100 Mbit"
        flags: "-c $TARGET -u -b 100M -t 10"
        parse: '(?P<rate>[\d.]+ [KMG]bits/sec)[^\n]*receiver'
        summary: "{rate}"
      - id: reverse
        name: "reverse (download)"
        flags: "-c $TARGET -R -t 10"
        parse: '(?P<rate>[\d.]+ [KMG]bits/sec)[^\n]*receiver'
        summary: "{rate}"

  - id: ethtool
    name: "Link & NIC Counters"
    bin: ethtool
    platform: linux
    presets:
      - id: link
        name: "link settings"
        flags: "$IFACE"
      - id: stats
        name: "driver stats"
        flags: "-S $IFACE"

# A chain runs its recipe IDs in order against one scope, sharing one $OUTDIR.
# It stops at the first non-zero exit unless that step says `continue: true`.
chains:
  - id: reach
    name: "reachability · ping, trace, ptr"
    steps:
      - ping/quick
      - recipe: traceroute/icmp
        continue: true
      - dig/ptr
